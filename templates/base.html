<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <style>
    
    * {
      margin: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    main {
      margin: 0;
      padding: 40px;
      background: #dde4ea;
      display: flex;
      justify-content: center;
    }

    .card-container {
      /* padding-top: 10%; */
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 1300px;
    }

    .card {
      background: #fff;
      width: 220px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: 0.3s;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-header {
      height: 100px;
      border-bottom-left-radius: 50% 20%;
      border-bottom-right-radius: 50% 20%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    .python { background: linear-gradient(to right, #00c9ff, #92fe9d); }
    .java { background: linear-gradient(to right, #fc466b, #3f5efb); }
    .uiux { background: linear-gradient(to right, #f7971e, #ffd200); }
    .data { background: linear-gradient(to right, #00d2ff, #3a47d5); }
    .flutter { background: linear-gradient(to right, #43e97b, #38f9d7); }

    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      margin-bottom: 10px;
      font-size: 18px;
      color: #222;
    }

    .card-content p {
      font-size: 13px;
      color: #555;
      margin: 4px 0;
    }

    .tag {
      display: inline-block;
      background: #333;
      color: #fff;
      padding: 5px 15px;
      border-radius: 20px;
      margin-top: 10px;
      font-size: 12px;
    }
    nav{
      background-color:lightgreen;
      height: 80px;
      padding-left: 40%;
      padding-right: 40%;
      
      
    }
    ol{
      display: flex;
      list-style: none;
      justify-content: space-between;
     padding-top: 7.5%;
     color: darkslategray;
     font-weight: bolder;
    }
  </style>
   
  {% include 'nav.html' %}
  
  {%block content%}
  
  {%endblock content%}
 
</body>
</html>
